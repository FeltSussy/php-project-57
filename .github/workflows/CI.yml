name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite

    steps:
      - uses: actions/checkout@v6

      - name: setup php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
      
      - name: setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Laravel setup
        run: make setup

      - name: Linter
        run: make lint

      - name: Seeding
        run: php artisan db:seed

      - name: Feature tests
        run: php artisan test
