name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite

    steps:
      - uses: actions/checkout@v7

      - name: setup php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v7

      - name: Laravel setup
        run: make setup

      - name: Linter
        run: make lint

      - name: Phpstan
        run: make phpstan

      - name: Tests
        run: make test

      - name: Coverage
        run: make coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
